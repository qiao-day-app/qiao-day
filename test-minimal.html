<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title>
<style>body{font-family:sans-serif;padding:20px;background:#1a1a1a;color:#fff}#result{font-size:24px;margin-top:20px;color:#0f0}</style>
</head>
<body>
<h1>测试页面</h1>
<div id="result">等待JS执行...</div>
<script>
'use strict';
document.getElementById('result').textContent = '✅ JS执行成功！时间：' + new Date().toLocaleTimeString();
// Test localStorage
try { localStorage.setItem('test', 'ok'); document.getElementById('result').textContent += ' | localStorage: OK'; } catch(e) { document.getElementById('result').textContent += ' | localStorage: FAIL'; }
</script>
</body>
</html>
