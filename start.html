<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#1a1a1a">
  <title>瞧的一天</title>
  <link rel="stylesheet" href="styles-20260730.css?v=20260801-home-split">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐶%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <!-- 顶部黑条（仅非小故事页面显示） -->
    <header class="top-bar" id="topBar">
      <div class="top-bar-left">
        <span class="top-title" id="topTitle">到店取 · 喜外送</span>
        <span class="top-sub" id="topSub">瞧的一天 ›</span>
      </div>
      <div class="top-bar-right">
        <span class="top-rating" id="topRating">⭐ 5.0 <i class="dot"></i></span>
      </div>
    </header>

    <!-- 主内容 -->
    <main id="main">
      <div class="loading-hint" id="loadingHint">加载中…</div>
    </main>

    <!-- 底部 Tab -->
    <nav class="bottom-tab" id="bottomTab">
      <a class="tab-item active" data-tab="home">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7"/><path d="M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg></span>
        <span class="tab-label">首页</span>
      </a>
      <a class="tab-item" data-tab="story">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h4a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3H7a2.5 2.5 0 0 0-2.5 2.5V5.5Z"/><path d="M19.5 5.5A2.5 2.5 0 0 0 17 3h-3v18a3 3 0 0 1 3-3h.5a2 2 0 0 1 2 2V5.5Z"/></svg></span>
        <span class="tab-label">小故事</span>
      </a>
      <a class="tab-item" data-tab="outfit">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.2a2.5 2.5 0 1 1 3.8 2.1L12 9.2v1.3"/><path d="m12 10.5-8.5 6.2a1 1 0 0 0 .6 1.8h15.8a1 1 0 0 0 .6-1.8L12 10.5Z"/></svg></span>
        <span class="tab-label">穿搭</span>
      </a>
      <a class="tab-item" data-tab="shop">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h14l-1 12H6l-1-12Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span>
        <span class="tab-label">周边</span>
      </a>
      <a class="tab-item" data-tab="me">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>
        <span class="tab-label">我的</span>
      </a>
    </nav>

    <!-- 弹窗容器 -->
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal" id="modal"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 全屏图片查看器 -->
    <div class="img-viewer" id="imgViewer">
      <button class="img-viewer-close" id="imgViewerClose" aria-label="Back">‹</button>
      <div class="img-viewer-swipe" id="imgViewerSwipe"></div>
      <div class="viewer-card-peek viewer-card-peek-left" id="viewerPrev" aria-hidden="true"></div>
      <div class="viewer-card-peek viewer-card-peek-right" id="viewerNext" aria-hidden="true"></div>
      <div class="viewer-gesture-demo" id="viewerSwipeHint" aria-hidden="true">
        <span class="viewer-gesture-track"></span>
        <svg class="viewer-gesture-hand" viewBox="0 0 32 32"><path d="M13 15V7.8a2 2 0 0 1 4 0V14m0-4.2a2 2 0 0 1 4 0V14m0-3a2 2 0 0 1 4 0v7.3c0 6-3.8 9.7-9.2 9.7h-1.6a8 8 0 0 1-6.8-3.8L4.8 20a2.1 2.1 0 0 1 3.4-2.4L13 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="viewer-gesture-label">左右拖动</span>
      </div>
      <div class="img-viewer-info" id="imgViewerInfo"></div>
    </div>
  </div>

  <script>
    // 全局错误捕获：任何 JS 错误都直接显示在页面上
    window._qiao_errors = [];
    window._qiao_appLoaded = false;
    window.onerror = function(msg, url, line, col, err) {
      window._qiao_errors.push(String(msg) + ' (行' + line + ')');
      try {
        var h = document.getElementById('loadingHint');
        if (h) h.innerHTML = '<span style="color:#ff6b6b;font-size:14px;">JS错误: ' + String(msg).substring(0, 80) + ' (行' + line + ')</span>';
      } catch(e) {}
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window._qiao_errors.push('Promise错误: ' + String(e.reason));
      try {
        var h = document.getElementById('loadingHint');
        if (h) h.innerHTML = '<span style="color:#ff6b6b;font-size:14px;">Promise错误: ' + String(e.reason).substring(0, 80) + '</span>';
      } catch(e2) {}
    });
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        window._qiao_errors.push('脚本加载失败: ' + (e.target.src || 'unknown'));
        try {
          var h = document.getElementById('loadingHint');
          if (h) h.textContent = '脚本加载失败，请检查网络';
        } catch(e2) {}
      }
    }, true);
  </script>
  <script src="app-20260730b.js?v=20260801-nickname-on-demand" onerror="window._qiao_appLoaded=false;document.getElementById('loadingHint').textContent='app.js加载失败，请刷新'"></script>
  <!-- 终极兜底：即使外链 JS 加载失败/崩溃，也确保页面不卡在"加载中" -->
  <script>
    (function() {
      var t = 0;
      var maxWait = 6000;
      function showDiag() {
        var errs = (window._qiao_errors || []).join('<br>');
        var info = [];
        info.push('URL: ' + location.href);
        info.push('online: ' + navigator.onLine);
        info.push('appLoaded: ' + window._qiao_appLoaded);
        info.push('bootOk: ' + (window._qiao_boot_ok ? 'yes' : 'no'));
        info.push('errors:<br>' + (errs || '无'));
        return info.join('<br>');
      }
      function check() {
        t += 400;
        try {
          var hint = document.getElementById('loadingHint');
          // 如果 app.js 已接管，停止兜底
          if (window._qiao_boot_ok) return;
          if (!hint || hint.textContent !== '加载中…') return;
        } catch(e) {}
        if (t >= maxWait) {
          try {
            var h = document.getElementById('loadingHint');
            if (h) h.remove();
            var m = document.getElementById('main');
            if (m) {
              m.innerHTML = '<div id="fallback" style="color:#666;text-align:center;padding:50px 20px;font-size:14px;"><p style="font-size:18px;margin-bottom:10px;">😢 加载失败</p><p style="color:#999;font-size:12px;">app.js 未能在6秒内启动</p><button onclick="location.reload(true)" style="margin:16px 0;padding:10px 40px;background:#333;color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;">🔄 强制刷新</button><div id="diag" style="margin-top:16px;padding:12px;background:#f7f7f7;border-radius:8px;text-align:left;font-size:11px;color:#888;line-height:1.6;word-break:break-all;">' + showDiag() + '</div></div>';
            }
          } catch(e2) {}
          return;
        }
        setTimeout(check, 400);
      }
      setTimeout(check, 400);
    })();
  </script>
</body>
</html>
