<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试</title><style>/* ========== 基础重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: #f5f1ea;
  color: #1a1a1a;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; outline: none; border: none; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

/* ========== 应用容器（手机适配） ========== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #fbf8f3;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 30px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* ========== 状态栏 ========== */
.status-bar {
  height: 36px;
  background: #fbf8f3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 600;
  color: #1a1a1a;
  flex-shrink: 0;
}
.status-bar .indicators { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.status-bar .battery { display: inline-flex; align-items: center; gap: 1px; }
.status-bar .battery em { font-style: normal; font-size: 11px; margin-left: 1px; }
.status-bar .signal { letter-spacing: -1px; font-size: 11px; }

/* ========== 顶部黑条 ========== */
.top-bar {
  background: #1a1a1a;
  color: #fff;
  padding: 14px 16px 16px;
  display: none;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  position: relative;
}
.top-bar.show { display: flex; }
.top-bar-left { display: flex; flex-direction: column; gap: 4px; }
.top-title { font-size: 14px; font-weight: 500; color: #e5e5e5; }
.top-sub { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.top-sub::after { content: "›"; font-weight: 300; opacity: 0.7; }
.top-bar-right {
  position: absolute;
  right: 16px;
  top: 16px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.top-rating {
  background: rgba(255,255,255,0.12);
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.top-rating .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #ff4757;
  display: inline-block;
  margin-left: 4px;
}

/* ========== 主内容 ========== */
#main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 80px;
}
#main::-webkit-scrollbar { display: none; }

/* ========== 底部 Tab ========== */
.bottom-tab {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 64px;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #999;
  font-size: 11px;
  transition: color 0.2s;
}
.tab-item .tab-icon { font-size: 22px; }
.tab-item.active { color: #1a1a1a; font-weight: 600; }
.tab-item.active .tab-icon { transform: scale(1.1); }

/* ========== 首页（小故事） ========== */
.story-hero {
  padding: 40px 30px 30px;
  text-align: center;
  background: linear-gradient(180deg, #fff 0%, #fbf8f3 100%);
}
.story-hero-logo {
  font-family: "STKaiti", "KaiTi", "楷体", serif;
  font-size: 56px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: -4px;
  line-height: 1;
  display: inline-block;
  text-align: left;
}
.story-hero-logo span { display: block; }
.story-hero-illust {
  margin: 30px auto 0;
  max-width: 280px;
  aspect-ratio: 1;
  background: #f5ead2;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 120px;
  position: relative;
  overflow: hidden;
}
.story-hero-illust img {
  width: 100%; height: 100%; object-fit: cover;
}
.story-quick {
  padding: 20px 20px 30px;
  display: flex;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid #f0ebe0;
}
.story-quick-img {
  width: 60px; height: 60px;
  border-radius: 12px;
  background: #f5ead2;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  overflow: hidden;
}
.story-quick-img img { width: 100%; height: 100%; object-fit: cover; }
.story-quick-info { flex: 1; }
.story-quick-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.story-quick-tag {
  display: inline-block;
  background: #fff5e6;
  color: #c98300;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-right: 4px;
}
.story-quick-tag.new { background: #ffe8e8; color: #c93838; }

.story-section-title {
  padding: 24px 20px 12px;
  font-size: 20px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
