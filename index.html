<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#1a1a1a">
  <title>瞧的一天</title>
  <link rel="stylesheet" href="styles-20260730.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐶%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <!-- 模拟手机状态栏 -->
    <div class="status-bar">
      <span class="time" id="statusTime">13:19</span>
      <span class="indicators">
        <span class="signal">●●●○</span>
        <span class="wifi">📡</span>
        <span class="battery">🔋<em>38</em></span>
      </span>
    </div>

    <!-- 顶部黑条（仅非小故事页面显示） -->
    <header class="top-bar" id="topBar">
      <div class="top-bar-left">
        <span class="top-title" id="topTitle">到店取 · 喜外送</span>
        <span class="top-sub" id="topSub">瞧的一天 ›</span>
      </div>
      <div class="top-bar-right">
        <span class="top-rating" id="topRating">⭐ 5.0 <i class="dot"></i></span>
      </div>
    </header>

    <!-- 主内容 -->
    <main id="main">
      <div class="loading-hint" id="loadingHint">加载中…</div>
    </main>

    <!-- 底部 Tab -->
    <nav class="bottom-tab" id="bottomTab">
      <a class="tab-item active" data-tab="story">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">小故事</span>
      </a>
      <a class="tab-item" data-tab="outfit">
        <span class="tab-icon">🛍️</span>
        <span class="tab-label">穿搭</span>
      </a>
      <a class="tab-item" data-tab="shop">
        <span class="tab-icon">🎁</span>
        <span class="tab-label">周边</span>
      </a>
      <a class="tab-item" data-tab="me">
        <span class="tab-icon">🐾</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>

    <!-- 弹窗容器 -->
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal" id="modal"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 全屏图片查看器 -->
    <div class="img-viewer" id="imgViewer">
      <button class="img-viewer-close" id="imgViewerClose">×</button>
      <div class="img-viewer-swipe" id="imgViewerSwipe"></div>
      <div class="img-viewer-info" id="imgViewerInfo"></div>
    </div>
  </div>

  <script src="app-20260730.js"></script>
  <!-- 终极兜底：即使外链 JS 加载失败/崩溃，也确保页面不卡在"加载中" -->
  <script>
    (function() {
      var t = 0;
      var maxWait = 5000;
      function check() {
        t += 300;
        try {
          var hint = document.getElementById('loadingHint');
          var main = document.getElementById('main');
          // 如果 loadingHint 消失，或被改变，说明 app.js 已接管
          if (!hint || hint.textContent !== '加载中…' || (window._qiao_boot_ok)) {
            return;
          }
        } catch(e) {}
        if (t >= maxWait) {
          try {
            var h = document.getElementById('loadingHint');
            if (h) h.remove();
            var m = document.getElementById('main');
            if (m && (!m.innerHTML || m.innerHTML.indexOf('story-grid') === -1)) {
              m.innerHTML = '<div style="color:#999;text-align:center;padding:60px 20px;"><p style="font-size:18px;margin-bottom:12px;">😢 加载失败</p><p style="font-size:13px;color:#bbb;">请确认已连接到互联网</p><p style="font-size:13px;color:#bbb;">然后用 Ctrl+Shift+R 硬刷新</p><button onclick="location.reload(true)" style="margin-top:16px;padding:10px 40px;background:#333;color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;">🔄 强制刷新</button></div>';
            }
          } catch(e2) {}
          return;
        }
        setTimeout(check, 300);
      }
      setTimeout(check, 300);
    })();
  </script>
</body>
</html>
